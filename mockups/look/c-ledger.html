<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>見本C 台帳</title>
<!-- 見本C：台帳。罫線と計器の枠を強め、画面の枠を揃える（取調室の小宮寄り）。
     ★ 3案で外部の書体はここの1つだけ（DotGothic16。見出し・計器・時刻だけに使う）。読めないときは等幅→ゴシックに落ちる -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0f1412; --panel: #151c19; --line: #2f4a3f; --line-hi: #5fae8c; --text: #dfe9e3; --dim: #8aa197;
    --warn: #e0b04f; --rec: #e04a3f;
    --dot: "DotGothic16", ui-monospace, "Osaka-Mono", "MS Gothic", monospace;
    --gothic: "Hiragino Sans", "Yu Gothic", "YuGothic", "Noto Sans JP", "Noto Sans CJK JP", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--gothic); }
  .wrap { max-width: 520px; margin: 0 auto; padding: 10px 10px 40px; }
  /* 画面の枠：上段は 記録中・日時、計器の列、下段は切り替え。どの画面でも位置が動かない */
  .frame { border: 2px solid var(--line-hi); background: var(--panel); }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-bottom: 2px solid var(--line-hi); font-family: var(--dot); font-size: 14px; letter-spacing: .08em; }
  .rec { color: var(--rec); }
  .rec::before { content: "●"; margin-right: 4px; animation: blink 1.6s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  @media (prefers-reduced-motion: reduce) { .rec::before { animation: none; } }
  .gauges { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 2px solid var(--line-hi); }
  .gauge { padding: 6px 8px 8px; border-right: 1px solid var(--line); }
  .gauge:last-child { border-right: 0; }
  .gauge .lab { font-family: var(--dot); font-size: 12px; color: var(--dim); display: flex; justify-content: space-between; }
  .gauge .val { font-family: var(--dot); font-size: 18px; }
  .meterbar { height: 6px; background: #22302a; margin-top: 4px; position: relative; }
  .meterbar i { position: absolute; inset: 0 auto 0 0; background: var(--line-hi); }
  .segs { display: flex; gap: 2px; margin-top: 4px; }
  .segs i { flex: 1; height: 6px; background: #22302a; }
  .segs i.on { background: var(--warn); }
  .body { padding: 10px 12px 14px;
    background-image: repeating-linear-gradient(transparent 0 29px, rgba(95,174,140,.13) 29px 30px); }
  h1 { font-family: var(--dot); font-size: 18px; margin: 2px 0 2px; letter-spacing: .06em; font-weight: 400; }
  .row { display: flex; font-size: 12px; color: var(--dim); gap: 8px; border-bottom: 1px solid var(--line); padding: 4px 0; }
  .row b { color: var(--text); font-weight: 400; }
  #lines { font-size: 15px; line-height: 30px; min-height: 9em; margin-top: 6px; }
  .log-line { margin: 0; opacity: 0; }
  .log-line.shown { opacity: 1; }
  .log-line.typing::after { content: "_"; color: var(--line-hi); }
  .hint { font-family: var(--dot); font-size: 12px; color: var(--dim); text-align: right; margin: 4px 0 0; }
  .foot { display: flex; gap: 10px; align-items: center; border-top: 2px solid var(--line-hi); padding: 8px 12px; }
  .hl { flex: 1; font-size: 12px; color: var(--dim); margin: 0; }
  .hanko { border: 2px solid var(--rec); color: var(--rec); font-family: var(--dot); padding: 4px 6px; transform: rotate(-6deg); font-size: 13px; text-align: center; }
  .stamp-btn { font-family: var(--dot); font-size: 14px; background: transparent; color: var(--warn); border: 2px solid var(--warn); padding: 6px 10px; }
  .stamp-btn:disabled { opacity: .35; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; border-top: 2px solid var(--line-hi); }
  .tabs button { font-family: var(--dot); font-size: 15px; padding: 9px; background: transparent; color: var(--dim); border: 0; border-right: 1px solid var(--line); }
  .tabs button:last-child { border-right: 0; }
  .tabs button.on { color: var(--bg); background: var(--line-hi); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 10px; }
  th { font-family: var(--dot); font-weight: 400; text-align: left; color: var(--dim); border-bottom: 1px solid var(--line-hi); padding: 4px 2px; font-size: 12px; }
  td { border-bottom: 1px solid var(--line); padding: 6px 2px; }
  td.r { text-align: right; color: var(--dim); white-space: nowrap; }
  td button { font: inherit; background: none; border: 0; color: var(--text); padding: 0; text-align: left; text-decoration: underline dotted var(--line-hi); }
  .ok { color: var(--line-hi); font-family: var(--dot); }
  .note { font-size: 12px; color: var(--dim); margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="look"></div>
  <p class="note">見本C「台帳」。画面のどこを押しても文字送りを飛ばせます。読了の判を押した報告書は、次に開くと最初から全部出ます（この画面の中だけ。保存はしません）。</p>
</div>
<script src="sample.js"></script>
<script src="look.js"></script>
<script>
  function clock() { var d = new Date(); return Look.todayLabel() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
  window.renderLook = function (view) {
    var L = Look, S = L.S, e = L.esc;
    var g = L.gauges();
    var gaugeHtml = '<div class="gauges">' + g.map(function (x) {
      var vis = x.key === "money"
        ? '<div class="meterbar"><i style="width:' + Math.max(0, Math.min(100, x.value / x.max * 100)) + '%"></i></div>'
        : '<div class="segs">' + Array.from({ length: x.max }, function (_, k) { return '<i class="' + (k < x.value ? 'on' : '') + '"></i>'; }).join("") + '</div>';
      return '<div class="gauge"><div class="lab"><span>' + e(x.label) + '</span></div><div class="val">' + e(x.text) + '</div>' + vis + '</div>';
    }).join("") + '</div>';
    var top = '<div class="frame"><div class="bar"><span class="rec">記録中</span><span>' + clock() + '</span></div>' + gaugeHtml;
    var tabs = '<div class="tabs"><button data-screen="report">報告書</button><button data-screen="base">台帳</button></div></div>';
    if (view.screen === "base") {
      return { html: top + '<div class="body">'
        + '<table><tr><th>掲示板</th><th></th></tr>' + S.board.map(function (q) { return '<tr><td>' + e(q.title) + '</td><td class="r">' + e(q.category) + '</td></tr>'; }).join("") + '</table>'
        + '<table><tr><th>名簿</th><th></th></tr>' + S.adventurers.map(function (a) { return '<tr><td>' + e(a.name) + '</td><td class="r">' + e(a.status) + (a.injury ? '・' + e(a.injury) : '') + '</td></tr>'; }).join("") + '</table>'
        + '<table><tr><th>報告書</th><th></th></tr>' + S.reports.map(function (r, i) { return '<tr><td><button data-open="' + i + '">' + e(r.questTitle) + '</button></td><td class="r">' + (r.readStampAt ? '<span class="ok">読了</span>' : '') + '</td></tr>'; }).join("") + '</table>'
        + '</div>' + tabs };
    }
    var r = S.reports[view.reportIndex];
    return { html: top + '<div class="body">'
      + '<h1>' + e(r.questTitle) + '</h1>'
      + '<div class="row">一行 <b>' + e(r.party.join("・")) + '</b></div><div class="row">結末 <b>' + e(r.result) + '</b></div>'
      + '<div id="lines"></div><p class="hint" id="skipHint">押すと全文 ▶▶</p></div>'
      + '<div class="foot"><p class="hl">' + e(r.highlight || r.summary || "") + '</p>'
      + (r.readStampAt ? '<div class="hanko">読了<br>' + L.stampDate(r.readStampAt) + '</div>' : '<button class="stamp-btn" id="stampBtn" disabled>読了の判を押す</button>')
      + '</div>' + tabs };
  };
</script>
</body>
</html>
