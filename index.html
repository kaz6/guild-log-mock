<!doctype html>
<html lang="ja" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 本作は文章そのものがゲーム体験の本体。ブラウザの機械翻訳は表示層を書き換えて体験を壊すため全ページで抑止する。 -->
  <meta name="google" content="notranslate" />
  <title>遠征ギルドログ HTML Mock v0.1.2</title>
  <link id="mainStyle" rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">✦</div>
        <div>
          <h1>遠征ギルドログ</h1>
          <p>HTML Mock v0.1.2 <span id="assetVersion" class="asset-version"></span></p>
        </div>
      </div>

      <nav class="main-nav" aria-label="メインメニュー">
        <button data-route="home" class="nav-button active">ギルド</button>
        <button data-route="quests" class="nav-button">依頼掲示板</button>
        <button data-route="adventurers" class="nav-button">冒険者名簿</button>
        <button data-route="observations" class="nav-button">報告メモ</button>
        <button data-route="ecology" class="nav-button">生態目録</button>
      </nav>

      <div class="sidebar-note">
        <span class="label">今回の検証</span>
        <p>同じ依頼でも変化する報告書を読む</p>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div>
          <p class="eyebrow">Record Keeper Desk</p>
          <h2 id="viewTitle">ギルド</h2>
        </div>
        <div class="topbar-actions">
          <button id="resetButton" class="ghost-button">Mock初期化</button>
        </div>
      </header>

      <section id="app" class="content" aria-live="polite"></section>
    </main>
  </div>

  <!-- 記録員バッジ（2026-08-09・EX-065）。★ 就任前は出さない（本当のオープニングには無い）。
       押すと記録係の名前と就任の日付だけを出す。数字も通知も付けない。 -->
  <div id="recorderBadgeRoot" class="recorder-badge-root" hidden>
    <div id="recorderBadgeCard" class="recorder-badge-card" role="dialog" aria-label="記録員バッジ" hidden></div>
    <button id="recorderBadge" class="recorder-badge" type="button" aria-expanded="false">
      <span class="recorder-badge-mark" aria-hidden="true">✦</span>
      <span>記録員</span>
    </button>
  </div>

  <!-- ── 読み込み（2026-09-18・EX-136）────────────────────────────────────
       ★ **配信を更新しても端末が古い app.js を最大10分持つ**（GitHub Pages は
         Cache-Control: max-age=600 を返す）。実機で確認するたびに待たされるので、
         スクリプトと style.css に**版のクエリ**を付けて読み込む。
       ★ **版を手で書き換える形にはしない**（書き忘れが必ず起きる）。配信元が返す
         検証子（ETag、無ければ Last-Modified）を**そのまま版として使う**ので、
         ファイルを変えれば版も勝手に変わり、変えなければ変わらない（＝再取得しない）。
       ★ **順序が依存関係**。`async = false` を付けた挿入は**挿入順に実行される**ので、
         下の並びがそのまま読み込み順になる。ここを並べ替えないこと。
       ⚠️ **file:// では fetch が使えない**ので、そのときは版を付けずにそのまま読む
         （ローカルで直接開く経路は README の案内どおり生かしてある）。
       ⚠️ **app.js の初回描画はこの挿入のあと**に走る。DOM は解析済みなので問題ないが、
         DOMContentLoaded を待つコードを足すと**もう発火していない**点に注意。
       ※ 診断モード（`?diag=1` の diag.js）は役目を終えたので EX-136 で削除した。
          作り直すときは EX-129／EX-130 の記録を見ること。 -->
  <script>
    (function () {
      var FILES = [
        "data-time.js",
        "data-adventurers.js",
        "data-items.js",
        "data-enemies.js",
        "data-quests.js",
        "data-outcomes.js",
        // 判定用語彙（2026-08-06・EX-061）。★ 定義と付与だけで、まだどこからも読んでいない
        "data-vocab.js",
        // 金と在庫の値（2026-09-23・EX-144）。★ すべて仮置き
        "data-money.js",
        // 冒険者の過去（2026-09-24・EX-146）。★ 文面・閾値とも仮
        "data-past.js",
        "app.js"
      ];
      var STYLE = "style.css";

      function inject(list) {
        list.forEach(function (src) {
          var el = document.createElement("script");
          el.src = src;
          el.async = false;
          document.body.appendChild(el);
        });
      }

      // 検証子を版の文字列にする（引用符や W/ を落として末尾12文字）
      function tokenOf(res) {
        var raw = res.headers.get("etag") || res.headers.get("last-modified") || "";
        return raw.replace(/[^A-Za-z0-9]/g, "").slice(-12);
      }

      function stamp(src) {
        return fetch(src, { method: "HEAD", cache: "no-store" }).then(function (res) {
          var token = res.ok ? tokenOf(res) : "";
          return token ? src + "?v=" + token : src;
        }).catch(function () {
          return src; // 版が取れなくても読み込みは止めない
        });
      }

      if (location.protocol === "file:" || typeof window.fetch !== "function") {
        inject(FILES);
        return;
      }

      Promise.all(FILES.concat([STYLE]).map(stamp)).then(function (stamped) {
        var css = stamped.pop();
        var style = document.getElementById("mainStyle");
        if (style && css !== STYLE) style.href = css;
        // 画面に出す版は app.js のもの（★ 実機で「新しい版が来ているか」を目で確かめるため）
        var appSrc = stamped[stamped.length - 1];
        var mark = document.getElementById("assetVersion");
        if (mark && appSrc.indexOf("?v=") >= 0) mark.textContent = "版 " + appSrc.split("?v=")[1];
        inject(stamped);
      }, function () {
        inject(FILES);
      });
    })();
  </script>
</body>
</html>
