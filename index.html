<!doctype html>
<html lang="ja" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 本作は文章そのものがゲーム体験の本体。ブラウザの機械翻訳は表示層を書き換えて体験を壊すため全ページで抑止する。 -->
  <meta name="google" content="notranslate" />
  <title>遠征ギルドログ HTML Mock v0.1.2</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">✦</div>
        <div>
          <h1>遠征ギルドログ</h1>
          <p>HTML Mock v0.1.2</p>
        </div>
      </div>

      <nav class="main-nav" aria-label="メインメニュー">
        <button data-route="home" class="nav-button active">ギルド</button>
        <button data-route="quests" class="nav-button">依頼掲示板</button>

        <div class="topbar-actions">

        </div>
      </header>

      <section id="app" class="content" aria-live="polite"></section>

  <script src="data-time.js"></script>
  <script src="data-adventurers.js"></script>
